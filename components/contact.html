<section id="contact" class="py-12 border-t border-slate-800">
    <div class="max-w-2xl mx-auto px-4">
        <h2 class="text-xl font-bold text-slate-200 mb-2 flex items-center gap-2">
            <span class="text-emerald-400">></span> Dołącz / Kontakt
        </h2>
        <p class="text-xs text-slate-400 mb-6">Wyślij wiadomość bezpośrednio do węzła głównego TechM8 / ProjectFreedom.</p>

        <form id="contact-form" onsubmit="handleContactSubmit(event)" class="space-y-4">
            <div>
                <label for="contactEmail" class="block text-xs font-mono text-slate-400 mb-1">TWÓJ EMAIL / IDENTYFIKATOR:</label>
                <input type="email" id="contactEmail" required placeholder="dev@example.com" class="w-full bg-slate-900/80 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 font-mono">
            </div>
            <div>
                <label for="contactMessage" class="block text-xs font-mono text-slate-400 mb-1">WIADOMOŚĆ / PARSOWANY INPUT:</label>
                <textarea id="contactMessage" rows="4" required placeholder="Opisz temat zgłoszenia lub projekt..." class="w-full bg-slate-900/80 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 font-mono"></textarea>
            </div>
            
            <div class="flex items-center justify-between pt-2">
                <button type="submit" id="contactSubmitBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold text-xs rounded transition-all font-mono">
                    [ Wyślij Wiadomość ]
                </button>
                <div id="contactStatus" class="text-xs font-mono text-slate-400"></div>
            </div>
        </form>
    </div>
</section>
