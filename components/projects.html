<section id="projects" class="space-y-6 scroll-mt-24">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-brand-border pb-4">
        <div>
            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                <span class="text-cyan-400">//</span> Rejestr Projektów
            </h2>
            <p class="text-xs text-gray-400 mt-0.5">Dynamiczna lista wdrożeń pobierana z bazy Supabase</p>
        </div>

        <div class="relative w-full md:w-72">
            <input type="text" id="search-input" oninput="filterProjects()" placeholder="Szukaj projektu..." 
                class="w-full bg-brand-card border border-brand-border rounded-lg px-4 py-2 text-xs text-gray-200 focus:outline-none focus:border-emerald-500 transition">
        </div>
    </div>

    <div class="flex flex-wrap gap-2 text-xs" id="tag-filters">
        <button onclick="setFilter('ALL')" class="tag-btn active-tag px-3 py-1 rounded-md border border-emerald-500 bg-emerald-500/20 text-emerald-300">Wszystkie</button>
        <button onclick="setFilter('#Proxmox')" class="tag-btn px-3 py-1 rounded-md border border-brand-border bg-brand-card text-gray-400 hover:border-gray-500">#Proxmox</button>
        <button onclick="setFilter('#Python')" class="tag-btn px-3 py-1 rounded-md border border-brand-border bg-brand-card text-gray-400 hover:border-gray-500">#Python</button>
        <button onclick="setFilter('#TrueNAS')" class="tag-btn px-3 py-1 rounded-md border border-brand-border bg-brand-card text-gray-400 hover:border-gray-500">#TrueNAS</button>
        <button onclick="setFilter('#Docker')" class="tag-btn px-3 py-1 rounded-md border border-brand-border bg-brand-card text-gray-400 hover:border-gray-500">#Docker</button>
        <button onclick="setFilter('#Raspberry Pi')" class="tag-btn px-3 py-1 rounded-md border border-brand-border bg-brand-card text-gray-400 hover:border-gray-500">#Raspberry Pi</button>
        <button onclick="setFilter('#AI Workflows')" class="tag-btn px-3 py-1 rounded-md border border-brand-border bg-brand-card text-gray-400 hover:border-gray-500">#AI Workflows</button>
    </div>

    <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full text-center py-12 text-gray-500 text-xs">
            Ładowanie projektów z bazy danych...
        </div>
    </div>
</section>
