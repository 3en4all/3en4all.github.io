<body class="min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-black">
    <header class="sticky top-0 z-40 bg-[#0a0f1d]/90 backdrop-blur border-b border-brand-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">TechM8<span class="text-emerald-500">//</span></span>
                <span class="hidden sm:inline-block text-xs px-2 py-0.5 rounded border border-emerald-500/30 text-emerald-400 bg-emerald-950/30">ProFree v2.5</span>
            </div>
            <div class="flex items-center space-x-1.5 sm:space-x-3">
                <div class="flex items-center rounded-lg border border-brand-border bg-brand-card/80 p-0.5 text-[10px] font-mono tracking-[0.08em] sm:tracking-[0.12em]" aria-label="Language switcher">
                    <button type="button" data-lang-btn="pl" onclick="setLanguage('pl')" aria-pressed="true" class="px-1.5 sm:px-2 py-1 rounded-md text-emerald-300 bg-emerald-500/10 transition-colors">PL</button>
                    <span class="text-gray-700">/</span>
                    <button type="button" data-lang-btn="en" onclick="setLanguage('en')" aria-pressed="false" class="px-1.5 sm:px-2 py-1 rounded-md text-gray-500 hover:text-cyan-300 transition-colors">EN</button>
                </div>
                <button id="health-check-btn" onclick="runHealthCheck()" class="flex items-center space-x-2 text-xs px-2 sm:px-3 py-1.5 rounded-lg border border-brand-border hover:border-emerald-500/50 bg-brand-card transition-all duration-300">
                    <span id="health-indicator" class="w-2 h-2 rounded-full bg-gray-500"></span>
                    <span id="health-text" class="hidden sm:inline text-gray-300">Node Status</span>
                </button>
                <button onclick="openBioModal()" class="text-xs px-2 sm:px-3 py-1.5 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20 transition">O mnie</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full space-y-12">
        <div id="hero" data-include="components/hero.html?v=20260906-3"></div>
        <div id="live" data-include="components/live.html?v=20260906-1"></div>
        <div id="about" data-include="components/about-brand.html?v=20260905-6"></div>
        <div id="insights" data-include="components/insights.html?v=20260906-1"></div>
        <div id="projects" data-include="components/projects.html?v=20260906-1"></div>

        <section id="research" class="border-t border-brand-border pt-12">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div>
                    <h2 class="text-2xl font-bold text-white flex items-center gap-2"><span class="text-emerald-500">&lt;</span>Lab & Research<span class="text-emerald-500">/&gt;</span></h2>
                    <p class="text-sm text-gray-400 mt-1">Opracowania popularnonaukowe, kosmologia i fizyka teoretyczna</p>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full whitespace-nowrap">#Science</span>
                    <div class="relative w-full md:w-72">
                        <input type="text" id="research-search-input" oninput="filterResearch()" placeholder="Szukaj w Lab & Research..." class="w-full bg-brand-card border border-brand-border rounded-lg px-4 py-2 text-xs text-gray-200 focus:outline-none focus:border-emerald-500 transition">
                    </div>
                </div>
            </div>
            <div id="research-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="col-span-full text-center py-8 text-gray-500 text-xs">Ładowanie publikacji z bazy danych...</div></div>
        </section>

        <div id="contact" data-include="components/contact.html?v=20260905-6"></div>
    </main>

    <footer class="border-t border-brand-border bg-[#0a0f1d] py-6 text-center text-xs text-gray-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
