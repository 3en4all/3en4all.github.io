<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechM8 // Infrastructure, Python & AI Workflows</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0a0f1d',
                            card: '#111827',
                            emerald: '#10b981',
                            cyan: '#00b4d8',
                            border: '#1f2937'
                        }
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-black">

    <!-- HEADER / NAVIGATION -->
    <header class="sticky top-0 z-40 bg-[#0a0f1d]/90 backdrop-blur border-b border-brand-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
                    TechM8<span class="text-emerald-500">//</span>
                </span>
                <span class="hidden sm:inline-block text-xs px-2 py-0.5 rounded border border-emerald-500/30 text-emerald-400 bg-emerald-950/30">
                    ProFree v2.5
                </span>
            </div>

            <div class="flex items-center space-x-3">
                <button id="health-check-btn" onclick="runHealthCheck()" class="flex items-center space-x-2 text-xs px-3 py-1.5 rounded-lg border border-brand-border hover:border-emerald-500/50 bg-brand-card transition-all duration-300">
                    <span id="health-indicator" class="w-2 h-2 rounded-full bg-gray-500"></span>
                    <span id="health-text" class="text-gray-300">Node Status</span>
                </button>
                <button onclick="openBioModal()" class="text-xs px-3 py-1.5 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20 transition">
                    O mnie
                </button>
            </div>
        </div>
    </header>

    <!-- KONTENER MODUŁÓW DYNAMICZNYCH -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full space-y-12">
        <div data-include="components/hero.html"></div>
        <div data-include="components/about-brand.html"></div>
        <div data-include="components/insights.html"></div>
        <div data-include="components/projects.html"></div>
        <div data-include="components/contact.html"></div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-brand-border bg-[#0a0f1d] py-6 text-center text-xs text-gray-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div>TechM8 &copy; 2026. Wszelkie prawa zastrzeżone.</div>
            <div class="text-gray-600">Engineered with Python, Supabase & Tailwind</div>
        </div>
    </footer>

    <!-- MODALE -->
    <div data-include="components/modals.html"></div>

    <!-- SKRYPT APLIKACJI -->
    <script src="js/app.js"></script>
</body>
</html>
