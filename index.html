<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechM8 // Hybrid V1 Preview</title>
    <meta name="robots" content="noindex,nofollow">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=hybrid-v1-effects-1">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0a0f1d',
                            card: '#111827',
                            emerald: '#10b981',
                            cyan: '#00b4d8',
                            border: '#1f2937'
                        }
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        .bg-brand-card { background-color: #0d1117 !important; }
        .border-brand-border { border-color: #30363d !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-black">

    <header class="sticky top-0 z-40 bg-[#070b14]/85 backdrop-blur-xl border-b border-brand-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold bg-gradient-to-r from-emerald-300 via-emerald-400 to-cyan-300 bg-clip-text text-transparent">
                    TechM8<span class="text-emerald-500">//</span>
                </span>
                <span class="hidden sm:inline-block text-[10px] px-2 py-1 rounded-full border border-cyan-500/25 text-cyan-300 bg-cyan-950/20 tracking-[0.12em] uppercase">
                    Hybrid V1 Preview
                </span>
            </div>

            <div class="flex items-center space-x-3">
                <button id="health-check-btn" onclick="runHealthCheck()" class="flex items-center space-x-2 text-xs px-3 py-1.5 rounded-lg border border-brand-border hover:border-emerald-500/50 bg-brand-card/80 transition-all duration-300">
                    <span id="health-indicator" class="w-2 h-2 rounded-full bg-gray-500"></span>
                    <span id="health-text" class="text-gray-300">Node Status</span>
                </button>
                <button onclick="openBioModal()" class="text-xs px-3 py-1.5 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20 transition">
                    O mnie
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full space-y-12">
        <div id="hero" data-include="components/hero.html?v=hybrid-v1-effects-1"></div>
        <div id="live" data-include="components/live.html?v=hybrid-v1-effects-1"></div>
        <div id="about" data-include="components/about-brand.html?v=hybrid-v1-effects-1"></div>
        <div id="insights" data-include="components/insights.html?v=hybrid-v1-effects-1"></div>
        <div id="projects" data-include="components/projects.html?v=hybrid-v1-effects-1"></div>

        <section id="research" class="border-t border-brand-border pt-12">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div>
                    <h2 class="text-2xl font-bold text-white flex items-center gap-2">
                        <span class="text-emerald-500">&lt;</span>Lab & Research<span class="text-emerald-500">/&gt;</span>
                    </h2>
                    <p class="text-sm text-gray-400 mt-1">Opracowania popularnonaukowe, kosmologia i fizyka teoretyczna</p>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full whitespace-nowrap">#Science</span>
                    <div class="relative w-full md:w-72">
                        <input type="text" id="research-search-input" oninput="filterResearch()" placeholder="Szukaj w Lab & Research..."
                            class="w-full bg-brand-card border border-brand-border rounded-lg px-4 py-2 text-xs text-gray-200 focus:outline-none focus:border-emerald-500 transition">
                    </div>
                </div>
            </div>

            <div id="research-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="col-span-full text-center py-8 text-gray-500 text-xs">Ładowanie publikacji z bazy danych...</div>
            </div>
        </section>

        <div id="contact" data-include="components/contact.html?v=hybrid-v1-effects-1"></div>
    </main>

    <footer class="border-t border-brand-border bg-[#070b14]/80 backdrop-blur py-6 text-center text-xs text-gray-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div>TechM8 &copy; 2026. Hybrid V1 experimental preview.</div>
            <div class="text-gray-600">Engineered with Python, Supabase & Tailwind</div>
        </div>
    </footer>

    <div data-include="components/modals.html?v=hybrid-v1-effects-1"></div>

    <script src="js/app.js?v=hybrid-v1-effects-1"></script>
    <script src="js/live.js?v=hybrid-v1-effects-1"></script>
    <script src="js/effects.js?v=hybrid-v1-effects-1"></script>
    <script src="js/projects-hybrid.js?v=hybrid-v1-projects-1"></script>
</body>
</html>
